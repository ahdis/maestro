# Quarkus deployment settings
quarkus.http.port=8150
quarkus.http.root-path=/maestro

quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health

quarkus.swagger-ui.always-include=true
# deactivate models section in swagger ui
quarkus.swagger-ui.default-models-expand-depth=-1
quarkus.swagger-ui.enable=${QUARKUS_SWAGGER_UI_ENABLE:true}
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger-ui
quarkus.swagger-ui.title=Maestro API
quarkus.swagger-ui.theme=original

quarkus.index-dependency.core.group-id=net.ihe.gazelle
quarkus.index-dependency.core.artifact-id=maestro
quarkus.index-dependency.commons.group-id=net.ihe.gazelle
quarkus.index-dependency.commons.artifact-id=maestro
quarkus.index-dependency.mlang-converter.group-id=net.ihe.gazelle
quarkus.index-dependency.mlang-converter.artifact-id=mlang-converter

# ITB configurations
itb.api.url=${ITB_API_URL: }
itb.api.key=${ITB_API_ORGANIZATION_KEY: }
%test.itb.api.url=http://test.fr
%test.itb.api.key=1234567890abcdef

gzl.root.test.bed.url=${ROOT_TEST_BED_URL}
gzl.terms.of.service.url=${GZL_TERMS_OF_SERVICE_URL}
datahouse.url=${GZL_DATAHOUSE_URL}
gzl.k8s.id.env.variable.name=GZL_MAESTRO_K8S_ID
gzl.k8s.id=${GZL_MAESTRO_K8S_ID}
gzl.m2m.registration.startup.enabled=true

# Gazelle variables
gzl.service.name=maestro
gzl.service.version=${quarkus.application.version}
gzl.maestro.timeout=${GZL_MAESTRO_TIMEOUT:60}
gzl.maestro.url=${GZL_MAESTRO_URL:http://localhost:${quarkus.http.port}${quarkus.http.root-path}}

gzl.service.registry.url=${GZL_SERVICE_REGISTRY_URL:http://localhost:8089/service-registry}
%test.gzl.service.registry.url=http://localhost:${%test.gzl.it-port}/service-registry
%test.gzl.service.registry.enabled=false

gzl.websocket.url=${GZL_WEBSOCKET_SERVER_URL: }
gzl.websocket.token=${GZL_WEBSOCKET_SERVER_TOKEN: }
%test.gzl.websocket.url=ws://localhost:8151/maestro/testRuns
%test.gzl.websocket.token=secret

# Tests
quarkus.http.test-port=8151
%test.gzl.it-port=34500
%test.gzl.maestro.timeout=10
%test.datahouse.url=http://localhost:8080/datahouse/rest/v1