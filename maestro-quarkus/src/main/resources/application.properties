# Quarkus settings
quarkus.http.port=8150
quarkus.http.root-path=/maestro
quarkus.log.level=INFO
quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health

# Service definition and registration
gzl.service.name=maestro
gzl.service.version=${quarkus.application.version}
gzl.service.k8s.id=maestro-ef29700000-001
gzl.maestro.url=http://localhost:${quarkus.http.port}${quarkus.http.root-path}
gzl.service.registry.enabled=true
gzl.service.registry.url=http://localhost:8097/service-registry
gzl.grading.default.timeout.minutes=60

# SSO configurations
gzl.m2m.registration.startup.enabled=true
gzl.m2m.client.secret=secret
gzl.sso.url=http://localhost/auth
gzl.sso.realm=gazelle
gzl.sso.admin.user=gazelle-clients-admin
gzl.sso.admin.password=gazelle
gzl.jwt.verify.audience=http://localhost
mp.jwt.verify.issuer=${gzl.sso.url}/realms/${gzl.sso.realm}
mp.jwt.verify.publickey.location=${gzl.sso.url}/realms/${gzl.sso.realm}/protocol/openid-connect/certs

# Permission Manager registration and RBAC refresh
permission-manager.enabled=${PERMISSION_MANAGER_ENABLED:false}
permission-manager.registration.enabled=${PERMISSION_MANAGER_REGISTRATION_ENABLED:false}
permission-manager.url=${PERMISSION_MANAGER_URL:http://localhost:8080/permission-manager}
permission-manager.application=${PERMISSION_MANAGER_APPLICATION:maestro}
permission-manager.application-version=${GZL_SERVICE_VERSION:${quarkus.application.version}}
permission-manager.refresh-interval=${PERMISSION_MANAGER_REFRESH_INTERVAL:PT1M}
permission-manager.classpath-fallback.enabled=true
permission-manager.startup.strict=${PERMISSION_MANAGER_STARTUP_STRICT:false}
%dev.quarkus.class-loading.reloadable-artifacts=net.ihe.gazelle:permission-manager-client

quarkus.index-dependency.security.group-id=net.ihe.gazelle
quarkus.index-dependency.security.artifact-id=security

# Application settings
gzl.terms.of.service.url=https://www.ihe-europe.net/privacy-policy

# Report recording
gzl.report.recording.enabled=true
datahouse.url=http://localhost/datahouse/rest/v1

# Datahouse index registration startup
datahouse.indexes.enabled=true
datahouse.indexes.fail-on-error=true
datahouse.indexes.owner=maestro
datahouse.indexes.version=1
datahouse.indexes.path=classpath:indexes/maestro-indexes.json
datahouse.indexes.retry.max-attempts=3
datahouse.indexes.retry.initial-delay=PT1S
datahouse.indexes.retry.max-delay=PT10S

# ITB configurations
itb.api.key=1234567890abcdef

# OpenAPI configuration
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.info-title=Maestro APIs
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.path=${quarkus.http.root-path}/openapi
quarkus.smallrye-openapi.servers=${gzl.maestro.url}
quarkus.smallrye-openapi.security-scheme=oauth2-implicit
quarkus.smallrye-openapi.security-scheme-name=Keycloak
mp.openapi.extensions.smallrye.auto-inheritance=NONE
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true
mp.openapi.scan.exclude.packages=net.ihe.gazelle.validation,net.ihe.gazelle.simulation

# Swagger UI configuration
quarkus.swagger-ui.enabled=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.default-models-expand-depth=1
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger-ui
quarkus.swagger-ui.title=Maestro APIs
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.oauth-client-id=OIDC_GAZELLE_CLIENT
quarkus.swagger-ui.oauth2-redirect-url=${quarkus.http.application-root-path}${quarkus.http.root-path}/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.persist-authorization=true

# Max WebSocket frame and message sizes
quarkus.websocket.max-frame-size=10485760
quarkus.websocket.max-message-size=104857600

# Mongo
#mongodb.username=gazelle
#mongodb.password=gazelle
#mongodb.host=127.0.0.1
#mongodb.port=27017
#mongodb.database=datahouse
#mongodb.connection.string=mongodb://${mongodb.username}:${mongodb.password}@${mongodb.host}:${mongodb.port}

# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:gazelle}
quarkus.datasource.password=${DB_PASSWORD:gazelle}

db.name=maestro
db.host=localhost
db.port=5432
db.jdbc.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}
quarkus.datasource.jdbc.url=${db.jdbc.url}
quarkus.datasource.jdbc.max-size=16

# Flyway configurations
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true

# Hibernate configurations
quarkus.hibernate-orm.schema-management.strategy=none

# Use H2 for tests
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=user
%test.quarkus.datasource.password=password
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:maestro
%test.quarkus.datasource.jdbc.driver=org.h2.Driver
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.baseline-on-migrate=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.datasource.jdbc.max-size=16

# Enable Hibernate ORM logging
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.format-sql=false
%test.quarkus.hibernate-orm.log.bind-parameters=false