# Quarkus deployment settings
quarkus.http.root-path=/maestro
quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health
quarkus.swagger-ui.always-include=true

# deactivate models section in swagger ui
quarkus.swagger-ui.default-models-expand-depth=-1
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger-ui
quarkus.swagger-ui.title=Maestro API
quarkus.swagger-ui.theme=original
quarkus.keycloak.devservices.enabled=false

# Quarkus indexes
quarkus.index-dependency.core.group-id=net.ihe.gazelle
quarkus.index-dependency.core.artifact-id=maestro
quarkus.index-dependency.commons.group-id=net.ihe.gazelle
quarkus.index-dependency.commons.artifact-id=maestro
quarkus.index-dependency.mlang-converter.group-id=net.ihe.gazelle
quarkus.index-dependency.mlang-converter.artifact-id=mlang-converter

# Quarkus runtime settings
quarkus.http.port=8150

# Application settings
gzl.service.name=maestro
gzl.service.version=${quarkus.application.version}
gzl.maestro.timeout=60
gzl.maestro.url=http://localhost:${quarkus.http.port}${quarkus.http.root-path}
gzl.websocket.url=ws://localhost:8150/maestro/testRuns
gzl.websocket.token=secret
gzl.root.test.bed.url=http://localhost:8080/tm
gzl.terms.of.service.url=https://www.ihe-europe.net/privacy-policy

# SSO configurations
gzl.k8s.id.env.variable.name=GZL_MAESTRO_K8S_ID
gzl.service.k8s.id=maestro-11898-11899
gzl.m2m.registration.startup.enabled=true
gzl.sso.url=http://localhost:28080
gzl.sso.admin.user=admin
gzl.sso.admin.password=password

# ITB configurations
itb.api.url=http://test.fr
itb.api.key=1234567890abcdef

# Datahouse configurations
datahouse.url=http://localhost:8082/datahouse/rest/v1

# Service registry configurations
gzl.service.registry.enabled=false
gzl.service.registry.url=http://localhost:8088/service-registry

gzl.it.port=34500