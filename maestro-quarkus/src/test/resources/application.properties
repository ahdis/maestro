# Quarkus settings
quarkus.http.test-port=0
quarkus.http.test-timeout=300s
quarkus.log.level=INFO
gzl.it.port=34500

# Service definition and registration
gzl.service.registry.enabled=false
gzl.service.registry.url=http://localhost:34500/service-registry

# SSO configurations
gzl.m2m.registration.startup.enabled=false
gzl.sso.url=http://localhost:${gzl.it.port}
gzl.sso.admin.user=admin
gzl.sso.admin.password=password
gzl.root.test.bed.url=http://localhost
mp.jwt.verify.issuer=https://localhost:8443
mp.jwt.verify.publickey.location=public_key.pem

# Report recording
gzl.report.recording.enabled=true
gzl.datahouse.url=http://localhost:34501/datahouse/rest/v1

# ITB configurations
itb.api.url=http://test.fr
itb.api.key=1234567890abcdef
